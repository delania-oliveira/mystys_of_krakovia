services:
  colyseus:
    build: .
    depends_on:
      - db
    ports:
      - "2567:2567"
    env_file:
      - .env.production
    command: node build/index.js
  db:
    image: postgres:18
    ports: 
      - '5432:5432'
    env_file:
      - .env.docker
    volumes:
      - db_data:/var/lib/postgresql/data
      
volumes:
  db_data:
    
